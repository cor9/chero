name: Build JAR (and Release on tags)

on:
  workflow_dispatch:          # manual "Run workflow" button
  push:                       # any branch: master/main/development/etc.
    branches: ['**']
  # Releases happen only if you push a tag like v1.0.0
  # (This is handled inside the job with a conditional step)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Install sbt
        uses: sbt/setup-sbt@v1

      - name: Build JAR
        run: sbt -v clean package

      - name: Locate JAR
        id: jar
        run: |
          FILE=$(ls -1 target/scala-*/Beatmeter*.jar | head -n1)
          echo "file=$FILE" >> $GITHUB_OUTPUT

      # Always upload as an artifact on Actions runs
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: Beatmeter-jar
          path: ${{ steps.jar.outputs.file }}

      # Only create a GitHub Release when the ref is a tag (e.g., refs/tags/v1.0.0)
      - name: Create GitHub Release (on tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.jar.outputs.file }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
